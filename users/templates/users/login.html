{% load static %}
<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | EgyFund</title>
    <link rel="icon" type="image/png" href="{% static 'assets/icons/logo_transparent.svg' %}">
    <link rel="stylesheet" href="{% static 'css/base/reset.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages/auth.css' %}">
</head>

<body class="auth-body">

    <main class="auth-page">

        <section class="login-card" aria-labelledby="login-title">

            <h1 id="login-title">Welcome Back</h1>

            {% if form.errors %}
                <p class="login-message error" role="alert" style="margin-bottom: 16px;">
                    Invalid email or password. Please try again.
                </p>
            {% endif %}

            <form id="login-form" method="post" action="">
                {% csrf_token %}

                <div class="login-field" style="margin-bottom: 16px;">
                    <label for="id_username">Email Address</label>
                    <input type="email"
                           id="id_username"
                           name="username"
                           placeholder="name@example.com"
                           autocomplete="email"
                           autofocus
                           required>
                </div>

                <div class="login-field" style="margin-bottom: 8px;">
                    <label for="id_password">Password</label>
                    <input type="password"
                           id="id_password"
                           name="password"
                           placeholder="Your password"
                           autocomplete="current-password"
                           required>
                </div>

                <a href="#" class="forgot-password">Forgot password?</a>

                <button type="submit" class="login-submit" style="margin-top: 20px;">Sign In</button>

                <input type="hidden" name="next" value="{{ next }}">

            </form>

            <div class="login-bottom-line"></div>

            <p class="signup-text">
                Don't have an account?
                <a href="{% url 'users:register' %}">Sign up</a>
            </p>

        </section>

    </main>

</body>

</html>
