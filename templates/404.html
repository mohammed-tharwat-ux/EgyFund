{% load static %}
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | EgyFund</title>
    <link rel="icon" type="image/png" href="{% static 'assets/icons/logo_transparent.svg' %}">
    <link rel="stylesheet" href="{% static 'css/base/reset.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages/auth.css' %}">
    <style>
        .error-code {
            font-size: 7rem;
            font-weight: 700;
            color: #e8eff7;
            font-family: Georgia, serif;
            line-height: 1;
            margin: 0 0 8px;
            letter-spacing: -4px;
        }
        .error-title {
            font-size: 1.5rem;
            font-family: Georgia, serif;
            color: #10182b;
            margin: 0 0 12px;
        }
        .error-message {
            color: #71809a;
            font-family: Arial, sans-serif;
            font-size: 0.95rem;
            margin: 0 0 32px;
            line-height: 1.5;
        }
        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-home {
            display: inline-block;
            padding: 11px 28px;
            background: #10182b;
            color: #fff;
            border-radius: 7px;
            text-decoration: none;
            font-family: Georgia, serif;
            font-size: 0.9rem;
            font-weight: 700;
        }
        .btn-back {
            display: inline-block;
            padding: 11px 28px;
            border: 1px solid #d9e1ec;
            color: #71809a;
            border-radius: 7px;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-size: 0.9rem;
        }
    </style>
</head>
<body class="auth-body">
    <main class="auth-page">
        <section class="auth-card" style="text-align: center; max-width: 460px;">
            <p class="error-code">404</p>
            <h1 class="error-title">Page not found</h1>
            <p class="error-message">
                Sorry, we couldn't find the page you were looking for.<br>
                It may have been moved, deleted, or never existed.
            </p>
            <div class="error-actions">
                <a href="/" class="btn-home">Go to Home</a>
                <a href="javascript:history.back()" class="btn-back">Go back</a>
            </div>
        </section>
    </main>
</body>
</html>
